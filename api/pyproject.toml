[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.161.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
dev = "src.main:dev"
pull = "src.elexon.pull:main"
test = "pytest:console_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
dev-mode-dirs = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-fail-under=75"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
